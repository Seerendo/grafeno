name: Contribution checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keeps build artifacts small on the CI runners.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  frontend:
    name: TypeScript client
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install the client's dependencies
        run: npm ci --prefix clients/typescript --no-audit --no-fund
      - name: Type-check and build the client
        run: npm run build --prefix clients/typescript

  engine:
    name: Rust engine and client integration
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the engine and the server
        run: cargo test --workspace --locked
      - name: Build the server for the client tests
        run: cargo build --locked -p grafeno-server
      - name: Test the client against the real server
        run: npm test --prefix clients/typescript
      - name: The client's contract with this engine and the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bins="$PWD/target/debug/grafeno"
          # The latest published release, if there is one, as the previous engine.
          if tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null)"; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'grafeno-x86_64-unknown-linux-musl.tar.gz' --dir "$RUNNER_TEMP/previous"
            tar -xzf "$RUNNER_TEMP/previous/grafeno-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/previous"
            bins="$bins:$RUNNER_TEMP/previous/grafeno"
            echo "Previous engine: $tag"
          else
            echo "::notice::No release published yet: the contract runs against this engine only."
          fi
          GRAFENO_CONTRACT_BINS="$bins" node --test clients/typescript/test/contract.test.ts
      - name: Run the benchmark script once, without performance thresholds
        run: GRAFENO_BENCH_ROUNDS=1 node clients/typescript/bench/read-many.mjs
