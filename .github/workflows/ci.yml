name: Verificación de contribuciones

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Limita los artefactos de compilación en los runners de CI.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  frontend:
    name: Interfaz y cliente TypeScript
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            studio/package-lock.json
            clients/typescript/package-lock.json
      - name: Instalar dependencias de la interfaz
        run: npm ci --prefix studio --no-audit --no-fund
      - name: Comprobar tipos y compilar la interfaz
        run: npm run build --prefix studio
      - name: Instalar dependencias del cliente
        run: npm ci --prefix clients/typescript --no-audit --no-fund
      - name: Comprobar tipos y compilar el cliente
        run: npm run build --prefix clients/typescript

  engine:
    name: Motor Rust e integración del cliente
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ejecutar pruebas del motor y del servidor
        run: cargo test --workspace --locked --exclude grafeno-desktop
      - name: Compilar el servidor para las pruebas del cliente
        run: cargo build --locked -p grafeno-server
      - name: Probar el cliente contra el servidor real
        run: npm test --prefix clients/typescript

  desktop:
    name: Aplicación de escritorio Tauri
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Probar el transporte del controlador de escritorio
        run: python3 -m unittest discover -s apps/desktop/tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar bibliotecas de escritorio para Linux
        timeout-minutes: 10
        run: |
          # Evitar descargas retenidas en el espejo de Azure del runner.
          for grafeno_apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [ -f "$grafeno_apt_source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$grafeno_apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth dbus-x11
      - name: Preparar la interfaz que utiliza Tauri
        run: |
          npm ci --prefix studio --no-audit --no-fund
          npm run build --prefix studio
      - name: Ejecutar las pruebas del puente de escritorio
        run: cargo test --locked -p grafeno-desktop
      - name: Compilar la aplicación de escritorio
        run: cargo build --locked -p grafeno-desktop
      - name: Instalar el controlador de pruebas de Tauri
        run: cargo install tauri-driver --locked
      - name: Probar la ventana en una pantalla virtual
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 apps/desktop/tests/ui_smoke.py
      - name: Guardar capturas y diagnóstico del escritorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-escritorio-linux
          path: reports/desktop-e2e/
          if-no-files-found: ignore
          retention-days: 7
