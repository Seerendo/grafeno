# Builds the release files when a tag like v0.1.0 is pushed, and attaches
# them to a GitHub release, with a .sha256 for each:
#   the server: grafeno-<version>-windows-x64-setup.exe,
#     grafeno-x86_64-pc-windows-msvc.zip,
#     grafeno-x86_64-unknown-linux-musl.tar.gz, grafeno_<version>_amd64.deb,
#     grafeno-<version>-1.x86_64.rpm;
#   the desktop app: grafeno-desktop-<version>-windows-x64-setup.exe and
#     .msi, grafeno-desktop_<version>_amd64.deb,
#     grafeno-desktop-<version>-1.x86_64.rpm,
#     grafeno-desktop-<version>-x86_64.AppImage.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The desktop app needs WebKitGTK and the Studio's build; its own job
      # builds it.
      - run: cargo test --workspace --locked --exclude grafeno-desktop

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the .tar.gz, .deb and .rpm
        run: docker buildx build -f packaging/linux/Dockerfile --output dist/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/linux/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Grafeno Studio
        working-directory: studio
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build grafeno.exe
        run: cargo build --release --locked -p grafeno-server
      - name: Build the installer and the zip
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq "grafeno-server" | Select-Object -ExpandProperty version
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" packaging\windows\grafeno.iss
          New-Item -ItemType Directory -Force dist\zip | Out-Null
          Copy-Item target\release\grafeno.exe, README.md dist\zip\
          Compress-Archive -Path dist\zip\* -DestinationPath dist\grafeno-x86_64-pc-windows-msvc.zip
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256

  desktop-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Studio's and the bundler's packages
        run: |
          npm ci --prefix studio --no-audit --no-fund
          npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Build the installers (NSIS and MSI)
        working-directory: apps/desktop
        run: npx tauri build --ci
      - name: Name and checksum them
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = "target/release/bundle"
          Copy-Item (Get-ChildItem "$bundle/nsis/*.exe")[0] "dist/grafeno-desktop-$version-windows-x64-setup.exe"
          Copy-Item (Get-ChildItem "$bundle/msi/*.msi")[0] "dist/grafeno-desktop-$version-windows-x64.msi"
          Get-ChildItem dist/* | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*

  desktop-linux:
    needs: test
    # The oldest supported Ubuntu, so the AppImage runs on more systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK and the bundler's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - name: Install the Studio's and the bundler's packages
        run: |
          npm ci --prefix studio --no-audit --no-fund
          npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Build the .deb, .rpm and .AppImage
        working-directory: apps/desktop
        run: npx tauri build --ci
      - name: Name and checksum them
        run: |
          version=$(node -p "require('./apps/desktop/tauri.conf.json').version")
          bundle=target/release/bundle
          mkdir -p dist
          cp "$(ls $bundle/deb/*.deb | head -1)" "dist/grafeno-desktop_${version}_amd64.deb"
          cp "$(ls $bundle/rpm/*.rpm | head -1)" "dist/grafeno-desktop-${version}-1.x86_64.rpm"
          cp "$(ls $bundle/appimage/*.AppImage | head -1)" "dist/grafeno-desktop-${version}-x86_64.AppImage"
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*

  publish:
    needs: [linux, windows, desktop-windows, desktop-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "Grafeno $GITHUB_REF_NAME" --generate-notes
