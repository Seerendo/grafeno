<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>An agent’s write latency (p99) during a 300 000-node import</title><desc>The agent writes 200 times a second for 12 s. E1-disk.</desc><rect width="100%" height="100%" rx="8" fill="#1a1a19"/><text x="24.0" y="34.0" font-size="16" fill="#f0efec" text-anchor="start" font-weight="600">An agent’s write latency (p99) during a 300 000-node import</text><text x="24.0" y="54.0" font-size="12" fill="#9a998f" text-anchor="start" font-weight="400">The agent writes 200 times a second for 12 s. E1-disk.</text><line x1="268.5" y1="66.0" x2="268.5" y2="252.0" stroke="#2e2e2c" stroke-width="1"/><text x="268.5" y="268.0" font-size="11" fill="#9a998f" text-anchor="middle" font-weight="400">1 ms</text><line x1="366.5" y1="66.0" x2="366.5" y2="252.0" stroke="#2e2e2c" stroke-width="1"/><text x="366.5" y="268.0" font-size="11" fill="#9a998f" text-anchor="middle" font-weight="400">10 ms</text><line x1="464.5" y1="66.0" x2="464.5" y2="252.0" stroke="#2e2e2c" stroke-width="1"/><text x="464.5" y="268.0" font-size="11" fill="#9a998f" text-anchor="middle" font-weight="400">100 ms</text><line x1="562.5" y1="66.0" x2="562.5" y2="252.0" stroke="#2e2e2c" stroke-width="1"/><text x="562.5" y="268.0" font-size="11" fill="#9a998f" text-anchor="middle" font-weight="400">1k ms</text><line x1="660.5" y1="66.0" x2="660.5" y2="252.0" stroke="#2e2e2c" stroke-width="1"/><text x="660.5" y="268.0" font-size="11" fill="#9a998f" text-anchor="middle" font-weight="400">10k ms</text><text x="256.5" y="91.0" font-size="12" fill="#f0efec" text-anchor="end" font-weight="400">none (agent alone)</text><path d="M268.5,79.0 H308.5 Q312.5,79.0 312.5,83.0 V91.0 Q312.5,95.0 308.5,95.0 H268.5 Z" fill="#199e70"/><text x="318.5" y="92.0" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">2.8 ms</text><text x="256.5" y="121.0" font-size="12" fill="#f0efec" text-anchor="end" font-weight="400">around the writer, one transaction</text><path d="M268.5,109.0 H664.4 Q668.4,109.0 668.4,113.0 V121.0 Q668.4,125.0 664.4,125.0 H268.5 Z" fill="#5c5c56"/><text x="674.4" y="122.0" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">12k ms</text><text x="256.5" y="151.0" font-size="12" fill="#f0efec" text-anchor="end" font-weight="400">around the writer, chunks of 20000</text><path d="M268.5,139.0 H654.6 Q658.6,139.0 658.6,143.0 V151.0 Q658.6,155.0 654.6,155.0 H268.5 Z" fill="#5c5c56"/><text x="664.6" y="152.0" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">9 564 ms</text><text x="256.5" y="181.0" font-size="12" fill="#f0efec" text-anchor="end" font-weight="400">bulk lane, one transaction</text><path d="M268.5,169.0 H656.9 Q660.9,169.0 660.9,173.0 V181.0 Q660.9,185.0 656.9,185.0 H268.5 Z" fill="#5c5c56"/><text x="666.9" y="182.0" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">10k ms</text><text x="256.5" y="211.0" font-size="12" fill="#f0efec" text-anchor="end" font-weight="400">bulk lane, chunks of 20000</text><path d="M268.5,199.0 H543.1 Q547.1,199.0 547.1,203.0 V211.0 Q547.1,215.0 543.1,215.0 H268.5 Z" fill="#5c5c56"/><text x="553.1" y="212.0" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">696 ms</text><text x="256.5" y="241.0" font-size="12" fill="#f0efec" text-anchor="end" font-weight="400">bulk lane, chunks of 2000</text><path d="M268.5,229.0 H455.0 Q459.0,229.0 459.0,233.0 V241.0 Q459.0,245.0 455.0,245.0 H268.5 Z" fill="#3987e5"/><text x="465.0" y="242.0" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">88 ms</text><line x1="268.5" y1="66.0" x2="268.5" y2="252.0" stroke="#45453f" stroke-width="1"/><text x="24.0" y="300.0" font-size="11" fill="#9a998f" text-anchor="start" font-weight="400">Bulk lane with chunks of 2 000 is what the server does now. Data: docs/data/import_interference.csv</