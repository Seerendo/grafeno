<svg xmlns="http://www.w3.org/2000/svg" width="760" height="194" viewBox="0 0 760 194" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Ingesting 100 000 NDJSON lines over HTTP</title><desc>Lines per second, log scale; 50 000 nodes, then 50 000 edges between them by key. E1-mem, in process.</desc><rect width="100%" height="100%" rx="8" fill="#fcfcfb"/><text x="24.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Ingesting 100 000 NDJSON lines over HTTP</text><text x="24.0" y="54.0" font-size="12" fill="#76756f" text-anchor="start" font-weight="400">Lines per second, log scale; 50 000 nodes, then 50 000 edges between them by key. E1-mem, in process.</text><line x1="174.4" y1="66.0" x2="174.4" y2="132.0" stroke="#e4e3df" stroke-width="1"/><text x="174.4" y="148.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">10k</text><line x1="265.8" y1="66.0" x2="265.8" y2="132.0" stroke="#e4e3df" stroke-width="1"/><text x="265.8" y="148.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">20k</text><line x1="386.5" y1="66.0" x2="386.5" y2="132.0" stroke="#e4e3df" stroke-width="1"/><text x="386.5" y="148.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">50k</text><line x1="477.9" y1="66.0" x2="477.9" y2="132.0" stroke="#e4e3df" stroke-width="1"/><text x="477.9" y="148.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">100k</text><line x1="569.2" y1="66.0" x2="569.2" y2="132.0" stroke="#e4e3df" stroke-width="1"/><text x="569.2" y="148.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">200k</text><line x1="690.0" y1="66.0" x2="690.0" y2="132.0" stroke="#e4e3df" stroke-width="1"/><text x="690.0" y="148.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">500k</text><text x="162.4" y="91.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">first time</text><path d="M174.4,79.0 H290.6 Q294.6,79.0 294.6,83.0 V91.0 Q294.6,95.0 290.6,95.0 H174.4 Z" fill="#2a78d6"/><text x="300.6" y="92.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">25k</text><text x="162.4" y="121.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">sent again (a retry)</text><path d="M174.4,109.0 H642.7 Q646.7,109.0 646.7,113.0 V121.0 Q646.7,125.0 642.7,125.0 H174.4 Z" fill="#1baf7a"/><text x="652.7" y="122.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">360k</text><line x1="174.4" y1="66.0" x2="174.4" y2="132.0" stroke="#c9c8c2" stroke-width="1"/><text x="24.0" y="180.0" font-size="11" fill="#76756f" text-anchor="start" font-weight="400">Sent again, every line is a duplicate of its idempotency key and nothing is written. Data: docs/data/ingest_runs.csv</text></svg>
