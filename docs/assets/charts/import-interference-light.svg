<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>An agent’s write latency (p99) during a 300 000-node import</title><desc>The agent writes 200 times a second for 12 s. E1-disk.</desc><rect width="100%" height="100%" rx="8" fill="#fcfcfb"/><text x="24.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">An agent’s write latency (p99) during a 300 000-node import</text><text x="24.0" y="54.0" font-size="12" fill="#76756f" text-anchor="start" font-weight="400">The agent writes 200 times a second for 12 s. E1-disk.</text><line x1="342.1" y1="66.0" x2="342.1" y2="252.0" stroke="#e4e3df" stroke-width="1"/><text x="342.1" y="268.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">10 ms</text><line x1="447.5" y1="66.0" x2="447.5" y2="252.0" stroke="#e4e3df" stroke-width="1"/><text x="447.5" y="268.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">100 ms</text><line x1="552.9" y1="66.0" x2="552.9" y2="252.0" stroke="#e4e3df" stroke-width="1"/><text x="552.9" y="268.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">1k ms</text><line x1="658.3" y1="66.0" x2="658.3" y2="252.0" stroke="#e4e3df" stroke-width="1"/><text x="658.3" y="268.0" font-size="11" fill="#76756f" text-anchor="middle" font-weight="400">10k ms</text><text x="256.5" y="91.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">none (agent alone)</text><path d="M268.5,79.0 H280.0 Q284.0,79.0 284.0,83.0 V91.0 Q284.0,95.0 280.0,95.0 H268.5 Z" fill="#1baf7a"/><text x="290.0" y="92.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">2.8 ms</text><text x="256.5" y="121.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">around the writer, one transaction</text><path d="M268.5,109.0 H662.8 Q666.8,109.0 666.8,113.0 V121.0 Q666.8,125.0 662.8,125.0 H268.5 Z" fill="#b4b3ad"/><text x="672.8" y="122.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">12k ms</text><text x="256.5" y="151.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">around the writer, chunks of 20000</text><path d="M268.5,139.0 H652.2 Q656.2,139.0 656.2,143.0 V151.0 Q656.2,155.0 652.2,155.0 H268.5 Z" fill="#b4b3ad"/><text x="662.2" y="152.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">9 564 ms</text><text x="256.5" y="181.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">bulk lane, one transaction</text><path d="M268.5,169.0 H654.7 Q658.7,169.0 658.7,173.0 V181.0 Q658.7,185.0 654.7,185.0 H268.5 Z" fill="#b4b3ad"/><text x="664.7" y="182.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">10k ms</text><text x="256.5" y="211.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">bulk lane, chunks of 20000</text><path d="M268.5,199.0 H532.3 Q536.3,199.0 536.3,203.0 V211.0 Q536.3,215.0 532.3,215.0 H268.5 Z" fill="#b4b3ad"/><text x="542.3" y="212.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">696 ms</text><text x="256.5" y="241.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">bulk lane, chunks of 2000</text><path d="M268.5,229.0 H437.7 Q441.7,229.0 441.7,233.0 V241.0 Q441.7,245.0 437.7,245.0 H268.5 Z" fill="#2a78d6"/><text x="447.7" y="242.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">88 ms</text><line x1="268.5" y1="66.0" x2="268.5" y2="252.0" stroke="#c9c8c2" stroke-width="1"/><text x="24.0" y="300.0" font-size="11" fill="#76756f" text-anchor="start" font-weight="400">Bulk lane with chunks of 2 000 is what the server does now. Data: docs/data/import_interference.csv</text></svg>
